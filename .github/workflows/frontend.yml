# This workflow lints, typechecks, and builds the Vite/React frontend.

name: Frontend

on:
  push:
    branches: [ "prod", "dev" ]
  pull_request:
    branches: [ "prod", "dev" ]

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint
      run: pnpm run lint

    - name: Build (includes typecheck)
      run: pnpm run build
